name: Sync (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ghi_that:
        description: 'Ghi thật phiếu vào BigQuery (bỏ chọn = chỉ xem trước)'
        type: boolean
        default: false

concurrency:
  group: shelfsense-bigquery-write
  cancel-in-progress: false

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy

      - name: Authenticate Google Cloud
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcp_key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_key.json" >> "$GITHUB_ENV"

      - name: Đồng bộ phiếu kho (script 07)
        env:
          CHI_XEM_TRUOC: ${{ (github.event_name == 'schedule' || inputs.ghi_that) && '0' || '1' }}
          GOM_PHIEU_HOM_NAY: '1'      # gom cả hôm nay; script 07 tự tính lại các ngày chưa đủ nên không lệch tồn kho
          XAC_NHAN_GHI_THAT: '1'
        run: python scripts/07_dong_bo_phieu_sua.py

      - name: Xóa khóa
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp_key.json"
