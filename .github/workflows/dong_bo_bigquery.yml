name: Dong bo BigQuery moi 3 tieng

on:
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Ho_Chi_Minh"

  # Cho phép bấm chạy thủ công để kiểm tra
  workflow_dispatch:

concurrency:
  group: dong-bo-bigquery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai dat thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tao Google Cloud credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Dong bo du lieu BigQuery
        run: python 07_dong_bo_phieu_an_toan.py
