name: Dong bo BigQuery moi 3 tieng

on:
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Ho_Chi_Minh"

  # Cho phep chay thu cong; mac dinh chi xem truoc.
  workflow_dispatch:
    inputs:
      ghi_that:
        description: "Ghi that vao BigQuery (mac dinh bo chon = chi xem truoc)"
        type: boolean
        required: true
        default: false

# Dung chung mot nhom voi cac workflow khac cung ghi BigQuery
# de tranh hai tien trinh dong bo chay chong len nhau.
concurrency:
  group: shelfsense-bigquery-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cai dat thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tao Google Cloud credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY" || (echo "Thieu GitHub Secret GCP_SA_KEY" && exit 1)
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Dong bo du lieu BigQuery (script 07)
        env:
          # Lich tu dong ghi that; chay thu cong van tuy chon ghi_that.
          CHI_XEM_TRUOC: ${{ github.event_name == 'schedule' && '0' || (inputs.ghi_that && '0' || '1') }}
          XAC_NHAN_GHI_THAT: "1"
          GOM_PHIEU_HOM_NAY: "1"
        run: python scripts/07_dong_bo_phieu_sua.py

      - name: Xoa khoa
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
