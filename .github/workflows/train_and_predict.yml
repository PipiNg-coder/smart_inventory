name: Train and Predict (00:00 and 12:00 VN)

on:
  schedule:
    # 05:00 and 17:00 UTC = 12:00 and 00:00 Vietnam time
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      chay_mo_hinh:
        description: 'Run model training and forecast, then write forecast tables to BigQuery'
        type: boolean
        required: true
        default: true

concurrency:
  group: shelfsense-bigquery-write
  cancel-in-progress: false

jobs:
  train-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Authenticate Google Cloud
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GOOGLE_CREDENTIALS" || (echo "Missing GitHub Secret GCP_SA_KEY" && exit 1)
          printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcp_key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_key.json" >> "$GITHUB_ENV"

      - name: Train model and generate forecasts
        if: github.event_name == 'schedule' || inputs.chay_mo_hinh
        run: python notebooks/run_pipeline.py

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp_key.json"
