name: Train and Predict ShelfSense

on:
  schedule:
    # Giờ Việt Nam: 00:00/12:00 huấn luyện; 06:00/18:00 chỉ dự báo.
    - cron: '0 5,17 * * *'
    - cron: '0 11,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chọn chế độ chạy'
        type: choice
        required: true
        default: train_predict
        options:
          - train_predict
          - predict_only

concurrency:
  group: shelfsense-bigquery-write
  cancel-in-progress: false

jobs:
  train-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt

      # Cache dùng để mang model qua các runner độc lập.
      # Prefix restore giúp lần chạy 06:00/18:00 lấy model từ lần train gần nhất.
      - name: Restore saved model
        uses: actions/cache/restore@v4
        with:
          path: lightgbm_ton_kho.joblib
          key: shelfsense-model-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shelfsense-model-

      - name: Determine pipeline mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 11,23 * * *" ]; then
            MODE="predict_only"
          else
            MODE="train_predict"
          fi
          echo "PIPELINE_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Pipeline mode: $MODE"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Authenticate Google Cloud
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GOOGLE_CREDENTIALS" || (echo "Missing GitHub Secret GCP_SA_KEY" && exit 1)
          printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcp_key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_key.json" >> "$GITHUB_ENV"

      # Luon dong bo giao dich moi truoc khi doc Mart de train/du bao.
      # Neu dong bo that bai (vi du movement_id cu bi trung), workflow dung tai day.
      # Script chi doc nguon va chi ghi Mart/nhat_ky khi validate thanh cong;
      # khong sua/xoa stock_movement_live.
      - name: Sync operational data to Mart before ML
        env:
          CHI_XEM_TRUOC: "0"
          XAC_NHAN_GHI_THAT: "1"
          GOM_PHIEU_HOM_NAY: "1"
        run: python scripts/07_dong_bo_phieu_sua.py

      - name: Check saved model for predict-only mode
        if: env.PIPELINE_MODE == 'predict_only'
        run: test -s lightgbm_ton_kho.joblib || (echo "No saved model cache. Run train_predict first." && exit 1)

      - name: Run pipeline
        run: python notebooks/run_pipeline.py

      # Chỉ lưu cache mới sau lần huấn luyện. Các lần predict-only không ghi đè model cache.
      - name: Save newly trained model
        if: success() && env.PIPELINE_MODE == 'train_predict'
        uses: actions/cache/save@v4
        with:
          path: lightgbm_ton_kho.joblib
          key: shelfsense-model-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp_key.json"
